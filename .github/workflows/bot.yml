name: Run Discord Bot

on:
  workflow_dispatch:
  schedule:
    # Запуск каждые 4 часа
    - cron: '0 */4 * * *'

# Отменяет предыдущий запуск при появлении нового (чтобы не было 2 ботов)
concurrency:
  group: discord-bot-live
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # 5 часов 55 минут — максимум

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install discord.py requests flask

    - name: Run bot
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        OWNER_ID: ${{ secrets.OWNER_ID }}
      run: python bot.py
